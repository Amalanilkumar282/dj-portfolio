packages:
  - 'apps/*'
  - 'packages/*'

# ── Security overrides ──────────────────────────────────────────────────────
#
# Forces patched versions of transitive dependencies flagged by
# `pnpm audit --audit-level=high` in CI (the "Dependency audit" job). None
# of these are direct dependencies of any app: multer is pulled in by
# @nestjs/platform-express and never used directly (uploads go straight to
# Cloudinary from the browser — see media-pipeline.md); vitest, vite,
# postcss, undici and deepmerge-ts are all pulled in by the test/build
# toolchain. Overriding a transitive dependency's version is safe here
# rather than a real upgrade decision, since nothing in this codebase calls
# any of these directly.
#
# Re-run `pnpm audit --audit-level=high` after any dependency bump, and
# prune an entry here once the direct dependency that pulled it in has
# moved past the vulnerable range on its own.
overrides:
  multer: '>=2.3.0'
  # Capped below 4.0.0 deliberately: the codebase is written and tested
  # against vitest 2.x's config/API shape, and an unbounded ">=3.2.6"
  # resolves to whatever is newest — it actually picked 5.0.0 the first
  # time this was tried, three major versions past what anything here has
  # ever run against. This takes the smallest jump that clears the
  # advisory (3.2.6) without adding an untested major version on top.
  vitest: '>=3.2.6 <4.0.0'
  vite: '>=6.4.3'
  postcss: '>=8.5.18'
  undici: '>=6.27.0'
  deepmerge-ts: '>=8.0.0'

# ── Install-script policy ───────────────────────────────────────────────────
#
# A postinstall script is arbitrary code execution at install time, so this is
# a supply-chain control rather than bookkeeping. Only the packages below may
# run one; everything else is blocked.
onlyBuiltDependencies:
  # Prisma downloads and positions its query engine binaries.
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  # Native binaries for the bundler and the ESLint resolver.
  - esbuild
  - unrs-resolver

ignoredBuiltDependencies:
  # Telemetry, pulled in transitively by swagger-ui-dist.
  - '@scarf/scarf'
  # Optional native speed-ups. The pure-JS fallbacks are fine here.
  - protobufjs
  # Pulled in by Testcontainers for its Docker connection, used only by the
  # CI integration tests.
  - ssh2
  - cpu-features

# pnpm 11 turns "an install script was not run" into a hard error, even for a
# package explicitly listed above as ignored. That makes a deliberate policy
# decision fail the command and block every downstream script.
#
# Build control still comes entirely from `onlyBuiltDependencies`. This only
# stops the *reporting* of a skipped script from failing the install.
strictDepBuilds: false

# pnpm's own approval ledger for the packages above — it writes this block
# itself (with unresolved placeholder values) the first time it meets a
# postinstall script it hasn't been told about, and withholds running that
# script on any machine where these stay unresolved, e.g. a fresh Vercel
# build. Deliberately explicit rather than left as pnpm's placeholder text:
# true for everything in onlyBuiltDependencies above (needed for
# `prisma generate` to run) plus @swc/core (a real, non-optional build
# dependency of the vitest toolchain); false for @scarf/scarf, matching its
# ignoredBuiltDependencies entry (telemetry, never wanted).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
