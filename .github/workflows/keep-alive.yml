name: Keep API awake

# Render's free tier spins the API container down after 15 minutes of no
# traffic and takes 30-60s to wake back up on the next request. This pings
# the health endpoint often enough that it never gets the chance to sleep.
#
# Reads the URL from a repo VARIABLE (not a secret — it's just a public
# health-check URL, nothing sensitive), so this file never needs editing
# once the real API URL exists:
#
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables
#   tab -> "New repository variable" -> name API_HEALTH_URL, value
#   https://your-real-api.onrender.com/health
#
# Until that variable is set to a real URL, this workflow runs and no-ops
# harmlessly (skips the ping with a clear log line) rather than failing red
# on every run. The literal example URL above is treated as "not configured"
# too, because copying it into the repo variable is the same as not having a
# real API URL yet.
on:
  schedule:
    # Every 10 minutes. Comfortably under Render's 15-minute sleep timer,
    # with margin for GitHub's own scheduling jitter (documented to be up
    # to several minutes late under load).
    - cron: '*/10 * * * *'
  # Lets you trigger a run by hand from the Actions tab to test the setup
  # without waiting for the schedule.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          case "$API_HEALTH_URL" in
            ""|"https://your-real-api.onrender.com/health"|"https://your-real-api.onrender.com/health/ready")
            echo "API_HEALTH_URL repository variable is not set to a real API URL yet - skipping."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
            ;;
          esac

          echo "Pinging $API_HEALTH_URL"
          # --fail turns a non-2xx response into a failed step (so a real
          # outage shows up as a red run you'd notice), -sS keeps output
          # quiet on success but shows the real error on failure.
          curl --fail -sS --max-time 30 "$API_HEALTH_URL"
